<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif
}

#bar{
  height:58px;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px;
  position:relative;
  z-index:1000
}

button{
  height:40px;
  min-width:40px;
  border:0;
  border-radius:8px;
  background:#222;
  color:#fff;
  cursor:pointer;
  font-size:16px
}

button:hover{background:#333}

#address{
  flex:1;
  min-width:0;
  height:40px;
  border:1px solid #333;
  outline:none;
  border-radius:8px;
  background:#191919;
  color:#fff;
  padding:0 13px;
  font-size:14px
}

#go{
  background:#fff;
  color:#000;
  font-weight:bold
}

#page{
  position:absolute;
  top:58px;
  left:0;
  width:100%;
  height:calc(100% - 58px);
  border:0;
  background:#fff
}

#home{
  position:absolute;
  inset:58px 0 0;
  background:
    radial-gradient(circle at center,#202020,#080808 65%);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:20
}

#homebox{width:min(700px,90%)}

#home h1{
  font-size:60px;
  margin:0 0 10px
}

#home p{
  color:#999;
  margin-bottom:25px
}

#homeinput{
  width:100%;
  height:52px;
  border-radius:10px;
  border:1px solid #333;
  background:#151515;
  color:#fff;
  padding:0 15px;
  font-size:15px;
  outline:none
}

#loading{
  position:fixed;
  inset:58px 0 0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5000
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #444;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#error{
  position:fixed;
  inset:58px 0 0;
  background:#080808;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:4000;
  padding:30px
}

#errorbox{max-width:650px}

#error h2{font-size:28px}

#error p{
  color:#aaa;
  line-height:1.6;
  white-space:pre-wrap
}

#error button{margin-top:10px}

#status{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  border:1px solid #444;
  padding:8px 14px;
  border-radius:20px;
  display:none;
  z-index:9999;
  font-size:12px
}
</style>
</head>

<body>

<div id="bar">

<button id="back">←</button>
<button id="forward">→</button>
<button id="reload">↻</button>

<input
 id="address"
 placeholder="Enter URL or search..."
 autocomplete="off"
 spellcheck="false"
>

<button id="go">Go</button>
<button id="cloak">◉</button>
<button id="fullscreen">⛶</button>

</div>

<iframe
 id="page"
 allow="fullscreen; autoplay; clipboard-read; clipboard-write"
 referrerpolicy="no-referrer">
</iframe>

<div id="home">

<div id="homebox">

<h1>Web</h1>

<p>Ultraviolet Web Proxy</p>

<input
 id="homeinput"
 placeholder="https://example.com"
 autocomplete="off"
>

</div>

</div>

<div id="loading">
<div class="spinner"></div>
</div>

<div id="error">

<div id="errorbox">

<h2>Could not load this website</h2>

<p id="errortext"></p>

<button id="retry">Retry</button>

</div>

</div>

<div id="status"></div>

<!-- UV client files -->
<script src="../uv.bundle.js"></script>
<script src="./uv.config.js"></script>
<script src="./uv.handler.js"></script>

<script>
"use strict";

const page = document.getElementById("page");
const address = document.getElementById("address");
const home = document.getElementById("home");
const homeinput = document.getElementById("homeinput");
const loading = document.getElementById("loading");
const error = document.getElementById("error");
const errortext = document.getElementById("errortext");
const status = document.getElementById("status");

let currentURL = "";
let historyList = [];
let historyPosition = -1;

const BASE = new URL("./", location.href);

const UV_BUNDLE =
  new URL("uv.bundle.js", BASE).href;

const UV_CONFIG =
  new URL("uv.config.js", BASE).href;

const UV_HANDLER =
  new URL("uv.handler.js", BASE).href;

const UV_SW =
  new URL("uv.sw.js", BASE).href;

const UV_SERVICE =
  new URL("service/", BASE).pathname;


/* ---------------- STATUS ---------------- */

function showStatus(text){

  status.textContent = text;
  status.style.display = "block";

  clearTimeout(status.timer);

  status.timer = setTimeout(()=>{
    status.style.display = "none";
  },1800);
}


/* ---------------- LOADING ---------------- */

function showLoading(){
  loading.style.display = "flex";
}

function hideLoading(){
  loading.style.display = "none";
}


/* ---------------- ERROR ---------------- */

function showError(message){

  hideLoading();

  page.src = "about:blank";

  error.style.display = "flex";

  errortext.textContent = message;
}


/* ---------------- URL ---------------- */

function normalizeURL(value){

  value = String(value || "").trim();

  if(!value) return null;

  if(
    value.startsWith("http://") ||
    value.startsWith("https://")
  ){
    return value;
  }

  if(
    !value.includes(" ") &&
    value.includes(".")
  ){
    return "https://" + value;
  }

  return (
    "https://www.google.com/search?q=" +
    encodeURIComponent(value)
  );
}


/* ---------------- HISTORY ---------------- */

function addHistory(url){

  if(
    historyPosition >= 0 &&
    historyList[historyPosition] === url
  ){
    return;
  }

  historyList =
    historyList.slice(
      0,
      historyPosition + 1
    );

  historyList.push(url);

  historyPosition =
    historyList.length - 1;
}


/* ---------------- UV STARTUP ---------------- */

let uvReady = false;

async function startUV(){

  if(uvReady)
    return true;

  showStatus("Starting Ultraviolet...");

  /*
   * Make absolutely sure the service-worker
   * URL is inside the current HTML Hoster folder.
   */

  console.log("UV base:", BASE.href);
  console.log("UV service worker:", UV_SW);
  console.log("UV scope:", UV_SERVICE);

  if(!("serviceWorker" in navigator)){

    throw new Error(
      "Service Workers are not supported by this browser."
    );

  }

  /*
   * Register the worker using the page-relative URL.
   */

  const registration =
    await navigator.serviceWorker.register(
      UV_SW,
      {
        scope: UV_SERVICE
      }
    );

  /*
   * Wait for activation.
   */

  await navigator.serviceWorker.ready;

  /*
   * Check that the current page is actually
   * controlled by the UV service worker.
   */

  if(!navigator.serviceWorker.controller){

    /*
     * A newly registered service worker does not
     * necessarily control the current page until
     * the next navigation.
     */

    showStatus(
      "Activating UV..."
    );

    await new Promise(resolve=>{
      navigator.serviceWorker.addEventListener(
        "controllerchange",
        resolve,
        {once:true}
      );

      setTimeout(resolve,3000);
    });

  }

  uvReady = true;

  showStatus("Ultraviolet ready");

  return true;
}


/* ---------------- PROXY URL ---------------- */

function makeProxyURL(url){

  /*
   * __uv$config is supplied by uv.config.js.
   */

  if(
    typeof self.__uv$config === "undefined"
  ){

    throw new Error(
      "uv.config.js did not create __uv$config."
    );

  }

  const config =
    self.__uv$config;

  /*
   * Encode the destination.
   */

  const encoded =
    config.encodeUrl(url);

  /*
   * IMPORTANT:
   *
   * Do NOT use:
   *
   * location.origin + config.prefix
   *
   * because HTML Hoster puts the page inside
   * /p/HG66NK2B/.
   */

  return new URL(
    config.prefix + encoded,
    BASE
  ).href;
}


/* ---------------- LOAD ---------------- */

async function loadURL(
  value,
  record = true
){

  const url =
    normalizeURL(value);

  if(!url)
    return;

  showLoading();

  error.style.display =
    "none";

  if(record){
    addHistory(url);
  }

  currentURL =
    url;

  address.value =
    url;

  home.style.display =
    "none";

  try{

    document.title =
      "Web — " +
      new URL(url).hostname;

  }catch{

    document.title =
      "Web";

  }


  try{

    /*
     * Start UV.
     */

    await startUV();


    /*
     * Create the proxied URL.
     */

    const proxyURL =
      makeProxyURL(url);

    console.log(
      "Original:",
      url
    );

    console.log(
      "Proxy:",
      proxyURL
    );


    /*
     * Navigate iframe.
     */

    page.onload = ()=>{
      hideLoading();
      showStatus("Loaded");
    };

    page.src =
      proxyURL;


    /*
     * Don't spin forever.
     */

    setTimeout(()=>{

      if(
        currentURL === url &&
        loading.style.display !== "none"
      ){

        hideLoading();

        showStatus(
          "Proxy is taking longer than expected"
        );

      }

    },10000);


  }catch(e){

    console.error(
      "UV error:",
      e
    );

    showError(
      "Ultraviolet could not be started.\n\n" +
      e.message +
      "\n\n" +
      "Check that these files exist in:\n" +
      BASE.href + "\n\n" +
      "uv.bundle.js\n" +
      "uv.config.js\n" +
      "uv.handler.js\n" +
      "uv.sw.js"
    );

  }

}


/* ---------------- BACK ---------------- */

document
.getElementById("back")
.onclick = ()=>{

  if(historyPosition <= 0){

    showStatus(
      "No previous page"
    );

    return;

  }

  historyPosition--;

  loadURL(
    historyList[
      historyPosition
    ],
    false
  );

};


/* ---------------- FORWARD ---------------- */

document
.getElementById("forward")
.onclick = ()=>{

  if(
    historyPosition >=
    historyList.length - 1
  ){

    showStatus(
      "No next page"
    );

    return;

  }

  historyPosition++;

  loadURL(
    historyList[
      historyPosition
    ],
    false
  );

};


/* ---------------- RELOAD ---------------- */

document
.getElementById("reload")
.onclick = ()=>{

  if(!currentURL){

    showStatus(
      "Nothing to reload"
    );

    return;

  }

  loadURL(
    currentURL,
    false
  );

};


/* ---------------- GO ---------------- */

document
.getElementById("go")
.onclick = ()=>{

  loadURL(
    address.value
  );

};

address.addEventListener(
  "keydown",
  e=>{

    if(e.key === "Enter"){

      loadURL(
        address.value
      );

    }

  }
);


/* ---------------- HOME ---------------- */

homeinput.addEventListener(
  "keydown",
  e=>{

    if(e.key === "Enter"){

      loadURL(
        homeinput.value
      );

    }

  }
);


/* ---------------- RETRY ---------------- */

document
.getElementById("retry")
.onclick = ()=>{

  if(currentURL){

    loadURL(
      currentURL,
      false
    );

  }

};


/* ---------------- FULLSCREEN ---------------- */

document
.getElementById("fullscreen")
.onclick =
async()=>{

  try{

    if(!document.fullscreenElement){

      await document
        .documentElement
        .requestFullscreen();

    }else{

      await document.exitFullscreen();

    }

  }catch{

    showStatus(
      "Fullscreen unavailable"
    );

  }

};


/* ---------------- CLOAK ---------------- */

document
.getElementById("cloak")
.onclick = ()=>{

  document.title =
    "Google";

  let icon =
    document.querySelector(
      "link[rel='icon']"
    );

  if(!icon){

    icon =
      document.createElement(
        "link"
      );

    icon.rel =
      "icon";

    document.head.appendChild(
      icon
    );

  }

  icon.href =
    "data:image/svg+xml," +
    encodeURIComponent(`
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64">

        <circle
          cx="32"
          cy="32"
          r="30"
          fill="white"/>

        <path
          d="M32 10a22 22 0 1 0 22 22H32z"
          fill="#4285f4"/>

      </svg>
    `);

  showStatus(
    "Cloaked"
  );

};


/* ---------------- KEYBOARD ---------------- */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.ctrlKey &&
      e.key.toLowerCase() === "l"
    ){

      e.preventDefault();

      address.focus();

      address.select();

    }

    if(
      e.altKey &&
      e.key === "ArrowLeft"
    ){

      e.preventDefault();

      document
        .getElementById("back")
        .click();

    }

    if(
      e.altKey &&
      e.key === "ArrowRight"
    ){

      e.preventDefault();

      document
        .getElementById("forward")
        .click();

    }

  }
);


/* ---------------- START ---------------- */

console.log(
  "UV base:",
  BASE.href
);

console.log(
  "UV bundle:",
  UV_BUNDLE
);

console.log(
  "UV config:",
  UV_CONFIG
);

console.log(
  "UV handler:",
  UV_HANDLER
);

console.log(
  "UV service worker:",
  UV_SW
);

console.log(
  "UV scope:",
  UV_SERVICE
);

showStatus(
  "Ready"
);
</script>
</body>
</html>
