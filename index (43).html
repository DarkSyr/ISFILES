<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif
}

#bar{
  height:58px;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px;
  position:relative;
  z-index:1000
}

button{
  height:40px;
  min-width:40px;
  border:0;
  border-radius:8px;
  background:#222;
  color:#fff;
  cursor:pointer;
  font-size:16px
}

button:hover{
  background:#333
}

#address{
  flex:1;
  min-width:0;
  height:40px;
  border:1px solid #333;
  outline:none;
  border-radius:8px;
  background:#191919;
  color:#fff;
  padding:0 13px;
  font-size:14px
}

#go{
  background:#fff;
  color:#000;
  font-weight:bold
}

#page{
  position:absolute;
  top:58px;
  left:0;
  width:100%;
  height:calc(100% - 58px);
  border:0;
  background:#fff
}

#home{
  position:absolute;
  inset:58px 0 0;
  background:
    radial-gradient(circle at center,#202020,#080808 65%);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:20
}

#homebox{
  width:min(700px,90%)
}

#home h1{
  font-size:60px;
  margin:0 0 10px
}

#home p{
  color:#999;
  margin-bottom:25px
}

#homeinput{
  width:100%;
  height:52px;
  border-radius:10px;
  border:1px solid #333;
  background:#151515;
  color:#fff;
  padding:0 15px;
  font-size:15px;
  outline:none
}

#loading{
  position:fixed;
  inset:58px 0 0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5000
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #444;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#error{
  position:fixed;
  inset:58px 0 0;
  background:#080808;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:4000;
  padding:30px
}

#errorbox{
  max-width:650px
}

#error h2{
  font-size:28px
}

#error p{
  color:#aaa;
  line-height:1.6;
  white-space:pre-wrap
}

#error button{
  margin-top:10px
}

#status{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  border:1px solid #444;
  padding:8px 14px;
  border-radius:20px;
  display:none;
  z-index:9999;
  font-size:12px
}
</style>
</head>

<body>

<div id="bar">

<button id="back" title="Back">←</button>
<button id="forward" title="Forward">→</button>
<button id="reload" title="Reload">↻</button>

<input
 id="address"
 placeholder="Enter URL or search..."
 autocomplete="off"
 spellcheck="false"
>

<button id="go">Go</button>
<button id="cloak" title="Cloak">◉</button>
<button id="fullscreen" title="Fullscreen">⛶</button>

</div>

<iframe
 id="page"
 allow="fullscreen; autoplay; clipboard-read; clipboard-write"
 referrerpolicy="no-referrer">
</iframe>

<div id="home">

<div id="homebox">

<h1>Web</h1>

<p>Single-file web viewer</p>

<input
 id="homeinput"
 placeholder="https://example.com"
 autocomplete="off"
>

</div>

</div>

<div id="loading">
<div class="spinner"></div>
</div>

<div id="error">

<div id="errorbox">

<h2>Could not load this website</h2>

<p id="errortext"></p>

<button id="retry">Retry</button>

</div>

</div>

<div id="status"></div>

<script>
"use strict";

const page = document.getElementById("page");
const address = document.getElementById("address");
const home = document.getElementById("home");
const homeinput = document.getElementById("homeinput");
const loading = document.getElementById("loading");
const error = document.getElementById("error");
const errortext = document.getElementById("errortext");
const status = document.getElementById("status");

let currentURL = "";
let historyList = [];
let historyPosition = -1;

function showStatus(text){
  status.textContent = text;
  status.style.display = "block";

  clearTimeout(status.timer);

  status.timer = setTimeout(()=>{
    status.style.display = "none";
  },1800);
}

function showLoading(){
  loading.style.display = "flex";
}

function hideLoading(){
  loading.style.display = "none";
}

function normalizeURL(value){

  value = String(value || "").trim();

  if(!value) return null;

  if(
    value.startsWith("http://") ||
    value.startsWith("https://")
  ){
    return value;
  }

  if(
    !value.includes(" ") &&
    value.includes(".")
  ){
    return "https://" + value;
  }

  return (
    "https://www.google.com/search?q=" +
    encodeURIComponent(value)
  );
}

function addHistory(url){

  if(
    historyPosition >= 0 &&
    historyList[historyPosition] === url
  ){
    return;
  }

  historyList = historyList.slice(
    0,
    historyPosition + 1
  );

  historyList.push(url);

  historyPosition =
    historyList.length - 1;
}

function showError(message){

  hideLoading();

  page.src = "about:blank";

  error.style.display = "flex";

  errortext.textContent = message;
}

function loadURL(value, record = true){

  const url = normalizeURL(value);

  if(!url) return;

  showLoading();

  error.style.display = "none";

  if(record){
    addHistory(url);
  }

  currentURL = url;
  address.value = url;

  home.style.display = "none";

  try{
    document.title =
      "Web — " + new URL(url).hostname;
  }catch{
    document.title = "Web";
  }

  page.onload = ()=>{
    hideLoading();
    showStatus("Loaded");
  };

  page.onerror = ()=>{
    showError(
      "The browser refused to display this website.\n\n" +
      "This single-file version does not use a proxy server. " +
      "If the destination sends X-Frame-Options or CSP " +
      "frame restrictions, Chrome prevents it from being " +
      "displayed inside this iframe."
    );
  };

  page.src = url;

  /*
   * iframe navigation errors are not always exposed
   * to JavaScript, so prevent an infinite spinner.
   */
  setTimeout(()=>{
    if(
      currentURL === url &&
      loading.style.display !== "none"
    ){
      hideLoading();

      showStatus(
        "The site may block iframe embedding"
      );
    }
  },8000);
}

/* Back */

document.getElementById("back").onclick = ()=>{

  if(historyPosition <= 0){
    showStatus("No previous page");
    return;
  }

  historyPosition--;

  loadURL(
    historyList[historyPosition],
    false
  );
};

/* Forward */

document.getElementById("forward").onclick = ()=>{

  if(
    historyPosition >=
    historyList.length - 1
  ){
    showStatus("No next page");
    return;
  }

  historyPosition++;

  loadURL(
    historyList[historyPosition],
    false
  );
};

/* Reload */

document.getElementById("reload").onclick = ()=>{

  if(!currentURL){
    showStatus("Nothing to reload");
    return;
  }

  showLoading();

  page.src = currentURL;
};

/* Go */

document.getElementById("go").onclick = ()=>{
  loadURL(address.value);
};

address.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    loadURL(address.value);
  }
});

/* Home */

homeinput.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    loadURL(homeinput.value);
  }
});

/* Retry */

document.getElementById("retry").onclick = ()=>{

  if(currentURL){
    loadURL(currentURL, false);
  }
};

/* Fullscreen */

document.getElementById("fullscreen").onclick = async()=>{

  try{

    if(!document.fullscreenElement){

      await document.documentElement.requestFullscreen();

    }else{

      await document.exitFullscreen();

    }

  }catch{

    showStatus("Fullscreen unavailable");

  }
};

/* Cloak */

document.getElementById("cloak").onclick = ()=>{

  document.title = "Google";

  let icon =
    document.querySelector("link[rel='icon']");

  if(!icon){

    icon = document.createElement("link");

    icon.rel = "icon";

    document.head.appendChild(icon);
  }

  icon.href =
    "data:image/svg+xml," +
    encodeURIComponent(`
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64">

        <circle
          cx="32"
          cy="32"
          r="30"
          fill="white"/>

        <path
          d="M32 10a22 22 0 1 0 22 22H32z"
          fill="#4285f4"/>

      </svg>
    `);

  showStatus("Cloaked");
};

/* Keyboard */

document.addEventListener("keydown", e=>{

  if(
    e.ctrlKey &&
    e.key.toLowerCase() === "l"
  ){

    e.preventDefault();

    address.focus();
    address.select();
  }

  if(
    e.altKey &&
    e.key === "ArrowLeft"
  ){

    e.preventDefault();

    document.getElementById("back").click();
  }

  if(
    e.altKey &&
    e.key === "ArrowRight"
  ){

    e.preventDefault();

    document.getElementById("forward").click();
  }

});

showStatus("Ready");

</script>

</body>
</html>
