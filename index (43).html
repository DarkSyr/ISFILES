<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif
}

#bar{
  height:58px;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px;
  position:relative;
  z-index:1000
}

button{
  height:40px;
  min-width:40px;
  border:0;
  border-radius:8px;
  background:#222;
  color:#fff;
  cursor:pointer;
  font-size:16px
}

button:hover{
  background:#333
}

#address{
  flex:1;
  min-width:0;
  height:40px;
  border:1px solid #333;
  outline:none;
  border-radius:8px;
  background:#191919;
  color:#fff;
  padding:0 13px;
  font-size:14px
}

#go{
  background:#fff;
  color:#000;
  font-weight:bold
}

#page{
  position:absolute;
  top:58px;
  left:0;
  width:100%;
  height:calc(100% - 58px);
  border:0;
  background:#fff
}

#home{
  position:absolute;
  inset:58px 0 0;
  background:
    radial-gradient(circle at center,#202020,#080808 65%);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:20
}

#homebox{
  width:min(700px,90%)
}

#home h1{
  font-size:60px;
  margin:0 0 10px
}

#home p{
  color:#999;
  margin-bottom:25px
}

#homeinput{
  width:100%;
  height:52px;
  border-radius:10px;
  border:1px solid #333;
  background:#151515;
  color:#fff;
  padding:0 15px;
  font-size:15px;
  outline:none
}

#loading{
  position:fixed;
  inset:58px 0 0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5000
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #444;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#error{
  position:fixed;
  inset:58px 0 0;
  background:#080808;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:4000;
  padding:30px
}

#errorbox{
  max-width:700px
}

#error h2{
  font-size:28px
}

#error p{
  color:#aaa;
  line-height:1.6;
  white-space:pre-wrap
}

#status{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  border:1px solid #444;
  padding:8px 14px;
  border-radius:20px;
  display:none;
  z-index:9999;
  font-size:12px
}
</style>
</head>

<body>

<div id="bar">

<button id="back">←</button>
<button id="forward">→</button>
<button id="reload">↻</button>

<input
 id="address"
 placeholder="Enter URL or search..."
 autocomplete="off"
 spellcheck="false"
>

<button id="go">Go</button>
<button id="cloak">◉</button>
<button id="fullscreen">⛶</button>

</div>

<iframe
 id="page"
 allow="fullscreen; autoplay; clipboard-read; clipboard-write"
 referrerpolicy="no-referrer">
</iframe>

<div id="home">

<div id="homebox">

<h1>Web</h1>

<p>Scramjet Web Proxy</p>

<input
 id="homeinput"
 placeholder="https://example.com"
 autocomplete="off"
>

</div>

</div>

<div id="loading">
<div class="spinner"></div>
</div>

<div id="error">

<div id="errorbox">

<h2>Could not load this website</h2>

<p id="errortext"></p>

<button id="retry">Retry</button>

</div>

</div>

<div id="status"></div>


<script>
"use strict";

/*
===========================================================
SCRAMJET FRONTEND
===========================================================

IMPORTANT:

Current Scramjet uses:

    Controller
       ↓
    Service Worker
       ↓
    ProxyTransport
       ↓
    Wisp / HTTP transport
       ↓
    Internet

It does NOT work by doing:

    BareClient.fetch(url)

The official Scramjet project uses this architecture.
===========================================================
*/


/* =========================================================
   ELEMENTS
========================================================= */

const page =
  document.getElementById("page");

const address =
  document.getElementById("address");

const home =
  document.getElementById("home");

const homeinput =
  document.getElementById("homeinput");

const loading =
  document.getElementById("loading");

const error =
  document.getElementById("error");

const errortext =
  document.getElementById("errortext");

const status =
  document.getElementById("status");


/* =========================================================
   STATE
========================================================= */

let currentURL = "";

let historyList = [];

let historyPosition = -1;

let controller = null;

let frame = null;


/* =========================================================
   STATUS
========================================================= */

function showStatus(text){

  status.textContent = text;

  status.style.display = "block";

  clearTimeout(status.timer);

  status.timer =
    setTimeout(()=>{
      status.style.display = "none";
    },2000);
}


function showLoading(){

  loading.style.display = "flex";

}


function hideLoading(){

  loading.style.display = "none";

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  hideLoading();

  error.style.display = "flex";

  errortext.textContent = message;

}


/* =========================================================
   URL NORMALIZATION
========================================================= */

function normalizeURL(value){

  value =
    String(value || "").trim();

  if(!value)
    return null;


  if(
    value.startsWith("http://") ||
    value.startsWith("https://")
  ){

    return value;

  }


  if(
    !value.includes(" ") &&
    value.includes(".")
  ){

    return "https://" + value;

  }


  return (
    "https://www.google.com/search?q=" +
    encodeURIComponent(value)
  );

}


/* =========================================================
   HISTORY
========================================================= */

function addHistory(url){

  if(
    historyPosition >= 0 &&
    historyList[historyPosition] === url
  ){

    return;

  }


  historyList =
    historyList.slice(
      0,
      historyPosition + 1
    );


  historyList.push(url);

  historyPosition =
    historyList.length - 1;

}


/* =========================================================
   SCRAMJET INITIALIZATION
========================================================= */

async function initializeScramjet(){

  /*
   * Scramjet requires HTTPS for the service worker,
   * except when running on localhost.
   */

  if(
    location.protocol !== "https:" &&
    location.hostname !== "localhost" &&
    location.hostname !== "127.0.0.1"
  ){

    throw new Error(
      "Scramjet requires HTTPS. " +
      "Host this HTML page over HTTPS."
    );

  }


  if(
    !("serviceWorker" in navigator)
  ){

    throw new Error(
      "This browser does not support Service Workers."
    );

  }


  /*
   * Register the Scramjet service worker.
   *
   * The SW must ultimately be same-origin.
   */

  const registration =
    await navigator.serviceWorker.register(
      "/scramjet.sw.js",
      {
        scope:"/"
      }
    );


  await navigator.serviceWorker.ready;


  showStatus(
    "Scramjet service worker ready"
  );


  /*
   * The actual Scramjet Controller and transport
   * are expected to be supplied by the hosting
   * Scramjet application.
   */

  if(
    typeof $scramjetController ===
    "undefined"
  ){

    throw new Error(
      "Scramjet Controller is not installed.\n\n" +
      "A current Scramjet deployment requires the " +
      "Scramjet controller, WASM, inject script, " +
      "service worker, and a ProxyTransport."
    );

  }


  controller =
    $scramjetController;


  frame =
    controller.createFrame(
      page
    );


  await controller.wait();


  showStatus(
    "Scramjet ready"
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

async function loadURL(
  value,
  record=true
){

  const url =
    normalizeURL(value);


  if(!url)
    return;


  showLoading();

  error.style.display =
    "none";


  if(record){

    addHistory(url);

  }


  currentURL =
    url;

  address.value =
    url;

  home.style.display =
    "none";


  try{

    document.title =
      "Web — " +
      new URL(url).hostname;

  }catch{

    document.title =
      "Web";

  }


  try{

    if(!frame){

      await initializeScramjet();

    }


    /*
     * Current Scramjet Frame navigation.
     *
     * The Scramjet controller handles interception,
     * rewriting, cookies, redirects and transport.
     */

    frame.go(url);


    showStatus(
      "Loading " +
      new URL(url).hostname
    );


    /*
     * The page itself will report its navigation
     * through the Scramjet iframe.
     */

    setTimeout(()=>{
      hideLoading();
    },3000);


  }catch(e){

    console.error(
      "Scramjet:",
      e
    );

    showError(
      "Scramjet could not load this page.\n\n" +
      e.message
    );

  }

}


/* =========================================================
   IFRAME EVENTS
========================================================= */

page.addEventListener(
  "load",
  ()=>{

    hideLoading();

    showStatus(
      "Loaded"
    );

  }
);


/* =========================================================
   BACK
========================================================= */

document
.getElementById("back")
.onclick =
()=>{

  if(historyPosition <= 0){

    showStatus(
      "No previous page"
    );

    return;

  }


  historyPosition--;

  loadURL(
    historyList[
      historyPosition
    ],
    false
  );

};


/* =========================================================
   FORWARD
========================================================= */

document
.getElementById("forward")
.onclick =
()=>{

  if(
    historyPosition >=
    historyList.length - 1
  ){

    showStatus(
      "No next page"
    );

    return;

  }


  historyPosition++;

  loadURL(
    historyList[
      historyPosition
    ],
    false
  );

};


/* =========================================================
   RELOAD
========================================================= */

document
.getElementById("reload")
.onclick =
()=>{

  if(!currentURL){

    showStatus(
      "Nothing to reload"
    );

    return;

  }


  loadURL(
    currentURL,
    false
  );

};


/* =========================================================
   GO
========================================================= */

document
.getElementById("go")
.onclick =
()=>{

  loadURL(
    address.value
  );

};


address.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter"
    ){

      loadURL(
        address.value
      );

    }

  }
);


/* =========================================================
   HOME
========================================================= */

homeinput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter"
    ){

      loadURL(
        homeinput.value
      );

    }

  }
);


/* =========================================================
   RETRY
========================================================= */

document
.getElementById("retry")
.onclick =
()=>{

  if(currentURL){

    loadURL(
      currentURL,
      false
    );

  }

};


/* =========================================================
   FULLSCREEN
========================================================= */

document
.getElementById("fullscreen")
.onclick =
async()=>{

  try{

    if(
      !document.fullscreenElement
    ){

      await document
        .documentElement
        .requestFullscreen();

    }else{

      await document
        .exitFullscreen();

    }

  }catch{

    showStatus(
      "Fullscreen unavailable"
    );

  }

};


/* =========================================================
   CLOAK
========================================================= */

document
.getElementById("cloak")
.onclick =
()=>{

  document.title =
    "Google";


  let icon =
    document.querySelector(
      "link[rel='icon']"
    );


  if(!icon){

    icon =
      document.createElement(
        "link"
      );

    icon.rel =
      "icon";

    document.head.appendChild(
      icon
    );

  }


  icon.href =
    "data:image/svg+xml," +
    encodeURIComponent(`
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64">

        <circle
          cx="32"
          cy="32"
          r="30"
          fill="white"/>

        <path
          d="M32 10a22 22 0 1 0 22 22H32z"
          fill="#4285f4"/>

      </svg>
    `);


  showStatus(
    "Cloaked"
  );

};


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.ctrlKey &&
      event.key.toLowerCase() === "l"
    ){

      event.preventDefault();

      address.focus();

      address.select();

    }


    if(
      event.altKey &&
      event.key === "ArrowLeft"
    ){

      event.preventDefault();

      document
        .getElementById("back")
        .click();

    }


    if(
      event.altKey &&
      event.key === "ArrowRight"
    ){

      event.preventDefault();

      document
        .getElementById("forward")
        .click();

    }

  }
);


/* =========================================================
   STARTUP
========================================================= */

showStatus(
  "Starting Scramjet..."
);


/*
 * We intentionally don't pretend that Scramjet
 * can be loaded from one arbitrary CDN script.
 *
 * The current official architecture requires
 * same-origin controller/SW/WASM assets and
 * a ProxyTransport.
 */

try{

  await initializeScramjet();

}catch(e){

  console.error(e);

  showError(
    e.message +
    "\n\n" +
    "This HTML is the browser UI. " +
    "For a working current Scramjet proxy, " +
    "the Scramjet service worker/controller " +
    "and a transport server must also be deployed."
  );

}

</script>

</body>
</html>
