<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif
}

#bar{
  height:58px;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px;
  position:relative;
  z-index:1000
}

button{
  height:40px;
  min-width:40px;
  border:0;
  border-radius:8px;
  background:#222;
  color:#fff;
  cursor:pointer;
  font-size:16px
}

button:hover{
  background:#333
}

#address{
  flex:1;
  min-width:0;
  height:40px;
  border:1px solid #333;
  outline:none;
  border-radius:8px;
  background:#191919;
  color:#fff;
  padding:0 13px;
  font-size:14px
}

#address:focus{
  border-color:#666
}

#go{
  background:#fff;
  color:#000;
  font-weight:bold
}

#page{
  position:absolute;
  top:58px;
  left:0;
  width:100%;
  height:calc(100% - 58px);
  border:0;
  background:#fff;
  z-index:1
}

#home{
  position:absolute;
  inset:58px 0 0;
  background:
    radial-gradient(circle at center,#202020,#080808 65%);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:20
}

#homebox{
  width:min(700px,90%)
}

#home h1{
  font-size:60px;
  margin:0 0 10px
}

#home p{
  color:#999;
  margin-bottom:25px
}

#homeinput{
  width:100%;
  height:52px;
  border-radius:10px;
  border:1px solid #333;
  background:#151515;
  color:#fff;
  padding:0 15px;
  font-size:15px;
  outline:none
}

#loading{
  position:fixed;
  inset:58px 0 0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5000
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #444;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#error{
  position:fixed;
  inset:58px 0 0;
  background:#080808;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:4000;
  padding:30px
}

#errorbox{
  max-width:700px
}

#error h2{
  font-size:28px
}

#error p{
  color:#aaa;
  line-height:1.6;
  white-space:pre-wrap
}

#status{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  border:1px solid #444;
  padding:8px 14px;
  border-radius:20px;
  display:none;
  z-index:9999;
  font-size:12px
}
</style>
</head>

<body>

<div id="bar">

<button id="back" title="Back">←</button>
<button id="forward" title="Forward">→</button>
<button id="reload" title="Reload">↻</button>

<input
 id="address"
 placeholder="Enter URL or search..."
 autocomplete="off"
 spellcheck="false"
>

<button id="go">Go</button>
<button id="cloak" title="Cloak">◉</button>
<button id="fullscreen" title="Fullscreen">⛶</button>

</div>

<iframe
 id="page"
 allow="fullscreen; autoplay; clipboard-read; clipboard-write"
 referrerpolicy="no-referrer">
</iframe>

<div id="home">

<div id="homebox">

<h1>Web</h1>

<p>Scramjet Web Proxy</p>

<input
 id="homeinput"
 placeholder="https://example.com"
 autocomplete="off"
>

</div>

</div>

<div id="loading">
<div class="spinner"></div>
</div>

<div id="error">

<div id="errorbox">

<h2>Could not load this website</h2>

<p id="errortext"></p>

<button id="retry">Retry</button>

</div>

</div>

<div id="status"></div>


<!--
===========================================================
CURRENT SCRAMJET ARCHITECTURE
===========================================================

This uses:

Scramjet Controller
       ↓
proxy-transports
       ↓
libcurl-transport
       ↓
WISP
       ↓
Internet

IMPORTANT:

The following files must be available from THIS origin:

/sw.js
/scramjet/scramjet.all.js
/scramjet/scramjet.wasm

The service worker cannot simply be loaded from another
origin such as raw.githubusercontent.com.
===========================================================
-->

<script src="https://unpkg.com/@mercuryworkshop/libcurl-transport@2/dist/index.js"></script>

<script src="https://unpkg.com/@mercuryworkshop/scramjet@latest/dist/scramjet.all.js"></script>

<script src="https://unpkg.com/@mercuryworkshop/scramjet-controller@latest/dist/index.js"></script>

<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const page =
  document.getElementById("page");

const address =
  document.getElementById("address");

const home =
  document.getElementById("home");

const homeinput =
  document.getElementById("homeinput");

const loading =
  document.getElementById("loading");

const error =
  document.getElementById("error");

const errortext =
  document.getElementById("errortext");

const status =
  document.getElementById("status");


/* =========================================================
   CONFIGURATION
========================================================= */

/*
 * Current public WISP endpoint used by public static
 * Scramjet deployments.
 *
 * You can replace this later with your own WISP server.
 */

const WISP_SERVER =
  "wss://anura.pro/wisp/";


/*
 * Scramjet files on THIS origin.
 */

const SCRAMJET_PATH =
  "/scramjet/";

const SERVICE_WORKER =
  "/sw.js";


/* =========================================================
   STATE
========================================================= */

let currentURL = "";

let historyList = [];

let historyPosition = -1;

let controller = null;

let frame = null;

let initialized = false;


/* =========================================================
   STATUS
========================================================= */

function showStatus(text){

  status.textContent =
    text;

  status.style.display =
    "block";

  clearTimeout(
    status.timer
  );

  status.timer =
    setTimeout(
      ()=>{
        status.style.display =
          "none";
      },
      2500
    );

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(){

  loading.style.display =
    "flex";

}

function hideLoading(){

  loading.style.display =
    "none";

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  hideLoading();

  error.style.display =
    "flex";

  errortext.textContent =
    message;

}


/* =========================================================
   URL NORMALIZATION
========================================================= */

function normalizeURL(value){

  value =
    String(value || "")
      .trim();

  if(!value)
    return null;


  if(
    value.startsWith("blob:") ||
    value.startsWith("data:")
  ){

    return value;

  }


  if(
    value.startsWith("http://") ||
    value.startsWith("https://")
  ){

    return value;

  }


  if(
    !value.includes(" ") &&
    value.includes(".")
  ){

    return (
      "https://" +
      value
    );

  }


  return (
    "https://www.google.com/search?q=" +
    encodeURIComponent(value)
  );

}


/* =========================================================
   HISTORY
========================================================= */

function addHistory(url){

  if(
    historyPosition >= 0 &&
    historyList[
      historyPosition
    ] === url
  ){

    return;

  }


  historyList =
    historyList.slice(
      0,
      historyPosition + 1
    );


  historyList.push(
    url
  );


  historyPosition =
    historyList.length - 1;

}


/* =========================================================
   INITIALIZE SERVICE WORKER
========================================================= */

async function registerServiceWorker(){

  if(
    !("serviceWorker" in navigator)
  ){

    throw new Error(
      "This browser does not support Service Workers."
    );

  }


  /*
   * Scramjet needs the worker on the same origin.
   */

  const registration =
    await navigator.serviceWorker.register(
      SERVICE_WORKER,
      {
        scope: "/"
      }
    );


  await navigator.serviceWorker.ready;


  /*
   * Make sure this page is controlled.
   */

  if(
    !navigator.serviceWorker.controller
  ){

    showStatus(
      "Activating Scramjet worker..."
    );


    await new Promise(
      resolve =>
        navigator.serviceWorker.addEventListener(
          "controllerchange",
          resolve,
          {
            once:true
          }
        )
    );

  }


  return registration;

}


/* =========================================================
   INITIALIZE SCRAMJET
========================================================= */

async function initializeScramjet(){

  if(initialized)
    return;


  showStatus(
    "Starting Scramjet..."
  );


  await registerServiceWorker();


  /*
   * Check the current transport library.
   */

  if(
    typeof LibcurlTransport ===
    "undefined"
  ){

    throw new Error(
      "libcurl-transport failed to load."
    );

  }


  /*
   * Check Scramjet controller.
   */

  if(
    typeof ScramjetController ===
    "undefined"
  ){

    throw new Error(
      "Scramjet Controller failed to load."
    );

  }


  /*
   * Create libcurl transport.
   */

  const transport =
    new LibcurlTransport.LibcurlClient(
      {
        websocket:
          WISP_SERVER
      }
    );


  /*
   * Create the Scramjet controller.
   */

  controller =
    new ScramjetController.Controller(
      {
        serviceworker:
          navigator.serviceWorker.controller,

        transport:

          transport,

        config:{
          prefix:
            "/scramjet/"
        }
      }
    );


  await controller.wait();


  /*
   * Attach Scramjet to our iframe.
   */

  frame =
    controller.createFrame(
      page
    );


  initialized =
    true;


  showStatus(
    "Scramjet ready"
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

async function navigate(url){

  if(!initialized){

    await initializeScramjet();

  }


  /*
   * Scramjet's frame navigation handles
   * encoding and interception.
   */

  if(
    frame &&
    typeof frame.go === "function"
  ){

    await frame.go(
      url
    );

    return;

  }


  /*
   * Fallback for versions where the frame
   * exposes navigate().
   */

  if(
    frame &&
    typeof frame.navigate === "function"
  ){

    await frame.navigate(
      url
    );

    return;

  }


  throw new Error(
    "The installed Scramjet controller does not expose a navigation method."
  );

}


/* =========================================================
   LOAD URL
========================================================= */

async function loadURL(
  value,
  record=true
){

  const url =
    normalizeURL(
      value
    );


  if(!url)
    return;


  showLoading();

  error.style.display =
    "none";


  if(record){

    addHistory(
      url
    );

  }


  currentURL =
    url;

  address.value =
    url;

  home.style.display =
    "none";


  try{

    if(
      url.startsWith("blob:") ||
      url.startsWith("data:")
    ){

      page.src =
        url;

      page.onload =
        ()=>{
          hideLoading();
          showStatus("Loaded");
        };

      return;

    }


    try{

      document.title =
        "Web — " +
        new URL(
          url
        ).hostname;

    }catch{

      document.title =
        "Web";

    }


    showStatus(
      "Loading through Scramjet..."
    );


    await navigate(
      url
    );


    /*
     * The service worker now handles
     * the requests from the Scramjet frame.
     */

    setTimeout(
      ()=>{
        hideLoading();
        showStatus(
          "Loaded"
        );
      },
      700
    );


  }catch(e){

    console.error(
      "Scramjet:",
      e
    );


    showError(
      "The site could not be loaded through Scramjet.\n\n" +
      e.message +
      "\n\n" +
      "Check that sw.js and the Scramjet runtime are hosted on this same origin."
    );

  }

}


/* =========================================================
   BACK
========================================================= */

document
  .getElementById("back")
  .onclick =
  async()=>{

    if(
      historyPosition <= 0
    ){

      showStatus(
        "No previous page"
      );

      return;

    }


    historyPosition--;


    try{

      await loadURL(
        historyList[
          historyPosition
        ],
        false
      );

    }catch(e){

      console.error(e);

    }

  };


/* =========================================================
   FORWARD
========================================================= */

document
  .getElementById("forward")
  .onclick =
  async()=>{

    if(
      historyPosition >=
      historyList.length - 1
    ){

      showStatus(
        "No next page"
      );

      return;

    }


    historyPosition++;


    try{

      await loadURL(
        historyList[
          historyPosition
        ],
        false
      );

    }catch(e){

      console.error(e);

    }

  };


/* =========================================================
   RELOAD
========================================================= */

document
  .getElementById("reload")
  .onclick =
  async()=>{

    if(!currentURL){

      showStatus(
        "Nothing to reload"
      );

      return;

    }


    await loadURL(
      currentURL,
      false
    );

  };


/* =========================================================
   GO
========================================================= */

document
  .getElementById("go")
  .onclick =
  ()=>{

    loadURL(
      address.value
    );

  };


address.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "Enter"
    ){

      loadURL(
        address.value
      );

    }

  }
);


/* =========================================================
   HOME
========================================================= */

homeinput.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "Enter"
    ){

      loadURL(
        homeinput.value
      );

    }

  }
);


/* =========================================================
   RETRY
========================================================= */

document
  .getElementById("retry")
  .onclick =
  ()=>{

    if(currentURL){

      loadURL(
        currentURL,
        false
      );

    }

  };


/* =========================================================
   FULLSCREEN
========================================================= */

document
  .getElementById("fullscreen")
  .onclick =
  async()=>{

    try{

      if(
        !document.fullscreenElement
      ){

        await document
          .documentElement
          .requestFullscreen();

      }else{

        await document
          .exitFullscreen();

      }

    }catch{

      showStatus(
        "Fullscreen unavailable"
      );

    }

  };


/* =========================================================
   CLOAK
========================================================= */

document
  .getElementById("cloak")
  .onclick =
  ()=>{

    document.title =
      "Google";


    let icon =
      document.querySelector(
        "link[rel='icon']"
      );


    if(!icon){

      icon =
        document.createElement(
          "link"
        );

      icon.rel =
        "icon";

      document.head.appendChild(
        icon
      );

    }


    icon.href =
      "data:image/svg+xml," +
      encodeURIComponent(`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 64 64">

          <circle
            cx="32"
            cy="32"
            r="30"
            fill="white"/>

          <path
            d="M32 10a22 22 0 1 0 22 22H32z"
            fill="#4285f4"/>

        </svg>
      `);


    showStatus(
      "Cloaked"
    );

  };


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.ctrlKey &&
      e.key.toLowerCase() === "l"
    ){

      e.preventDefault();

      address.focus();

      address.select();

    }


    if(
      e.altKey &&
      e.key === "ArrowLeft"
    ){

      e.preventDefault();

      document
        .getElementById("back")
        .click();

    }


    if(
      e.altKey &&
      e.key === "ArrowRight"
    ){

      e.preventDefault();

      document
        .getElementById("forward")
        .click();

    }

  }
);


/* =========================================================
   STARTUP
========================================================= */

(async()=>{

  try{

    await initializeScramjet();

    showStatus(
      "Scramjet ready"
    );

  }catch(e){

    console.error(
      e
    );


    showError(
      "Scramjet could not start.\n\n" +
      e.message +
      "\n\n" +
      "You must host the Scramjet service worker and runtime files on the same origin as this HTML."
    );

  }

})();

</script>

</body>
</html>
