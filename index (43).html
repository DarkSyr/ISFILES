<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Web Proxy</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  height:40px;
  min-width:40px;
  border:0;
  border-radius:8px;
  background:#222;
  color:#fff;
  cursor:pointer;
  font-size:16px;
  transition:.15s;
}

button:hover{
  background:#333;
}

button:active{
  transform:scale(.96);
}

/* TOP BAR */

#bar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:58px;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px;
  z-index:10000;
}

#address{
  flex:1;
  min-width:0;
  height:40px;
  border:1px solid #333;
  outline:none;
  border-radius:8px;
  background:#191919;
  color:#fff;
  padding:0 13px;
  font-size:14px;
}

#address:focus{
  border-color:#777;
}

#go{
  background:#fff;
  color:#000;
  font-weight:bold;
}

/* PAGE */

#page{
  position:fixed;
  top:58px;
  left:0;
  right:0;
  bottom:0;
  overflow:auto;
  background:#fff;
  color:#000;
  z-index:1;
}

/* HOME */

#home{
  position:fixed;
  top:58px;
  left:0;
  right:0;
  bottom:0;
  background:
    radial-gradient(
      circle at center,
      #242424 0,
      #111 42%,
      #070707 75%
    );
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:100;
}

#homebox{
  width:min(760px,90%);
}

#home h1{
  margin:0;
  font-size:70px;
  letter-spacing:-4px;
}

#home p{
  color:#999;
  margin:8px 0 28px;
}

#homeinput{
  width:100%;
  height:54px;
  border-radius:11px;
  border:1px solid #383838;
  background:#151515;
  color:#fff;
  outline:none;
  padding:0 17px;
  font-size:15px;
}

#homeinput:focus{
  border-color:#777;
}

/* LOADING */

#loading{
  position:fixed;
  inset:58px 0 0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9000;
  backdrop-filter:blur(3px);
}

.spinner{
  width:45px;
  height:45px;
  border:4px solid #444;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ERROR */

#error{
  position:fixed;
  inset:58px 0 0;
  background:#080808;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  z-index:8000;
}

#errorbox{
  max-width:700px;
}

#error h2{
  font-size:28px;
  margin-top:0;
}

#error p{
  color:#aaa;
  line-height:1.6;
  white-space:pre-wrap;
}

#retry{
  margin-top:10px;
}

/* STATUS */

#status{
  position:fixed;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  background:#222;
  border:1px solid #444;
  padding:8px 14px;
  border-radius:20px;
  display:none;
  z-index:99999;
  font-size:12px;
}

/* INTERNAL PAGE */

.proxy-error{
  font-family:Arial,sans-serif;
  padding:40px;
  color:#222;
}

.proxy-error h1{
  margin-top:0;
}

/* MOBILE */

@media(max-width:650px){

  #bar{
    gap:4px;
  }

  #bar button{
    min-width:36px;
    padding:0;
  }

  #home h1{
    font-size:55px;
  }

}
</style>
</head>

<body>

<!-- =====================================================
     NAVIGATION BAR
===================================================== -->

<div id="bar">

<button id="back" title="Back">←</button>

<button id="forward" title="Forward">→</button>

<button id="reload" title="Reload">↻</button>

<input
  id="address"
  type="text"
  placeholder="Enter URL or search..."
  autocomplete="off"
  autocapitalize="off"
  spellcheck="false"
>

<button id="go">Go</button>

<button id="cloak" title="Cloak">◉</button>

<button id="fullscreen" title="Fullscreen">⛶</button>

</div>


<!-- =====================================================
     PAGE
===================================================== -->

<div id="page"></div>


<!-- =====================================================
     HOME
===================================================== -->

<div id="home">

<div id="homebox">

<h1>Web</h1>

<p>
Client-side proxy browser
</p>

<input
  id="homeinput"
  type="text"
  placeholder="https://example.com"
  autocomplete="off"
  spellcheck="false"
>

</div>

</div>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading">

<div class="spinner"></div>

</div>


<!-- =====================================================
     ERROR
===================================================== -->

<div id="error">

<div id="errorbox">

<h2>Could not load this website</h2>

<p id="errortext"></p>

<button id="retry">
Retry
</button>

</div>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div id="status"></div>


<script>

"use strict";


/* =====================================================
   CONFIGURATION
===================================================== */

/*
   Existing hosted proxy.

   CorsProxy documents:

   https://corsproxy.io/?url=ENCODED_TARGET

   as its recommended format.
*/

const PROXY =
  "https://corsproxy.io/?url=";


/*
   Change this if you later want to use another
   hosted CORS relay.
*/

const PROXY_NAME =
  "CorsProxy";


/* =====================================================
   ELEMENTS
===================================================== */

const page =
  document.getElementById("page");

const address =
  document.getElementById("address");

const home =
  document.getElementById("home");

const homeinput =
  document.getElementById("homeinput");

const loading =
  document.getElementById("loading");

const error =
  document.getElementById("error");

const errortext =
  document.getElementById("errortext");

const status =
  document.getElementById("status");


/* =====================================================
   STATE
===================================================== */

let currentURL = "";

let historyList = [];

let historyPosition = -1;

let lastErrorURL = "";


/* =====================================================
   STATUS
===================================================== */

function showStatus(text){

  status.textContent = text;

  status.style.display = "block";

  clearTimeout(status.timer);

  status.timer = setTimeout(() => {

    status.style.display = "none";

  },1800);

}


/* =====================================================
   LOADING
===================================================== */

function showLoading(){

  loading.style.display = "flex";

}


function hideLoading(){

  loading.style.display = "none";

}


/* =====================================================
   NORMALIZE URL
===================================================== */

function normalizeURL(value){

  value =
    String(value || "").trim();

  if(!value)
    return null;


  /*
     Already HTTP.
  */

  if(
    value.startsWith("https://") ||
    value.startsWith("http://")
  ){

    return value;

  }


  /*
     Looks like a domain.
  */

  if(
    !value.includes(" ") &&
    value.includes(".")
  ){

    return "https://" + value;

  }


  /*
     Search.

     DuckDuckGo is used instead of attempting
     to search through the destination directly.
  */

  return (
    "https://www.google.com/search?q=" +
    encodeURIComponent(value)
  );

}


/* =====================================================
   MAKE PROXY URL
===================================================== */

function makeProxyURL(target){

  return (
    PROXY +
    encodeURIComponent(target)
  );

}


/* =====================================================
   ABSOLUTE URL
===================================================== */

function absoluteURL(value,base){

  try{

    return new URL(
      value,
      base
    ).href;

  }catch{

    return value;

  }

}


/* =====================================================
   IS EXTERNAL RESOURCE
===================================================== */

function shouldIgnoreURL(url){

  if(!url)
    return true;

  const lower =
    url.toLowerCase().trim();

  return (
    lower.startsWith("#") ||
    lower.startsWith("data:") ||
    lower.startsWith("blob:") ||
    lower.startsWith("javascript:") ||
    lower.startsWith("mailto:") ||
    lower.startsWith("tel:")
  );

}


/* =====================================================
   REWRITE CSS URLS
===================================================== */

function rewriteCSS(css,base){

  /*
     Rewrite:

       url(...)
       @import "..."

     into proxy URLs.

     This is intentionally conservative.
  */

  css =
    css.replace(
      /url\s*\(\s*(['"]?)(.*?)\1\s*\)/gi,
      function(match,quote,url){

        url = url.trim();

        if(shouldIgnoreURL(url))
          return match;

        const absolute =
          absoluteURL(
            url,
            base
          );

        return (
          "url('" +
          makeProxyURL(absolute) +
          "')"
        );

      }
    );


  return css;

}


/* =====================================================
   REWRITE HTML
===================================================== */

function rewriteHTML(html,base){

  const parser =
    new DOMParser();

  const doc =
    parser.parseFromString(
      html,
      "text/html"
    );


  /*
     Remove CSP/meta redirects.
  */

  doc
    .querySelectorAll(
      "meta[http-equiv='Content-Security-Policy']," +
      "meta[http-equiv='content-security-policy']," +
      "meta[http-equiv='refresh']"
    )
    .forEach(el => el.remove());


  /*
     Remove scripts.

     This prevents destination JavaScript from
     executing inside the proxy application's origin.
  */

  doc
    .querySelectorAll("script")
    .forEach(el => el.remove());


  /*
     Rewrite normal URL attributes.
  */

  doc
    .querySelectorAll(
      "[href],[src],[action],[poster],[data-src]"
    )
    .forEach(el => {

      [
        "href",
        "src",
        "action",
        "poster",
        "data-src"
      ].forEach(attr => {

        if(!el.hasAttribute(attr))
          return;

        const original =
          el.getAttribute(attr);

        if(
          !original ||
          shouldIgnoreURL(original)
        )
          return;


        /*
           Fragment-only links remain local.
        */

        if(
          original.trim().startsWith("#")
        )
          return;


        const absolute =
          absoluteURL(
            original,
            base
          );


        /*
           Links are kept as normal absolute URLs.

           The click interceptor below sends them
           back through loadURL().
        */

        el.setAttribute(
          attr,
          absolute
        );

      });

    });


  /*
     srcset
  */

  doc
    .querySelectorAll("[srcset]")
    .forEach(el => {

      const original =
        el.getAttribute("srcset");

      const rewritten =
        original
          .split(",")
          .map(item => {

            const parts =
              item.trim().split(/\s+/);

            if(!parts[0])
              return item;

            if(
              shouldIgnoreURL(parts[0])
            )
              return item;

            parts[0] =
              makeProxyURL(
                absoluteURL(
                  parts[0],
                  base
                )
              );

            return parts.join(" ");

          })
          .join(", ");

      el.setAttribute(
        "srcset",
        rewritten
      );

    });


  /*
     Inline styles.
  */

  doc
    .querySelectorAll("[style]")
    .forEach(el => {

      const style =
        el.getAttribute("style");

      el.setAttribute(
        "style",
        rewriteCSS(
          style,
          base
        )
      );

    });


  /*
     Style elements.
  */

  doc
    .querySelectorAll("style")
    .forEach(el => {

      el.textContent =
        rewriteCSS(
          el.textContent,
          base
        );

    });


  /*
     Stylesheets.

     Instead of allowing the browser to fetch them
     directly, turn their href into proxy URLs.
  */

  doc
    .querySelectorAll(
      "link[rel='stylesheet'][href]"
    )
    .forEach(link => {

      const href =
        link.getAttribute("href");

      if(
        shouldIgnoreURL(href)
      )
        return;

      const absolute =
        absoluteURL(
          href,
          base
        );

      link.href =
        makeProxyURL(
          absolute
        );

    });


  /*
     Images/media/resources.

     Route them through the existing proxy.
  */

  doc
    .querySelectorAll(
      "img[src]," +
      "video[src]," +
      "audio[src]," +
      "source[src]," +
      "track[src]"
    )
    .forEach(el => {

      const src =
        el.getAttribute("src");

      if(
        shouldIgnoreURL(src)
      )
        return;

      const absolute =
        absoluteURL(
          src,
          base
        );

      el.setAttribute(
        "src",
        makeProxyURL(
          absolute
        )
      );

    });


  /*
     Iframes are disabled because loading arbitrary
     iframe content directly would bypass our loader.
  */

  doc
    .querySelectorAll(
      "iframe,object,embed"
    )
    .forEach(el => {

      const src =
        el.getAttribute("src");

      if(src){

        el.setAttribute(
          "data-proxy-original-src",
          absoluteURL(
            src,
            base
          )
        );

      }

      el.removeAttribute("src");

    });


  /*
     Remove base elements.

     The proxy URLs we inserted above are absolute.
  */

  doc
    .querySelectorAll("base")
    .forEach(el => el.remove());


  /*
     Forms are handled by JavaScript.
  */

  doc
    .querySelectorAll("form")
    .forEach(form => {

      form.setAttribute(
        "data-proxy-form",
        "true"
      );

    });


  return (
    "<!DOCTYPE html>" +
    doc.documentElement.outerHTML
  );

}


/* =====================================================
   FETCH TARGET
===================================================== */

async function fetchTarget(url){

  showLoading();

  error.style.display =
    "none";

  page.innerHTML = "";


  try{

    const proxyURL =
      makeProxyURL(url);


    showStatus(
      "Fetching through " +
      PROXY_NAME + "..."
    );


    const response =
      await fetch(
        proxyURL,
        {
          method:"GET",
          credentials:"omit",
          redirect:"follow",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Proxy HTTP " +
        response.status +
        " " +
        response.statusText
      );

    }


    const type =
      (
        response.headers.get(
          "content-type"
        ) || ""
      ).toLowerCase();


    /* ==============================================
       HTML
    ============================================== */

    if(
      type.includes("text/html") ||
      type.includes("application/xhtml")
    ){

      const html =
        await response.text();


      const rewritten =
        rewriteHTML(
          html,
          url
        );


      /*
         Use a DOM document instead of directly
         allowing scripts from the target.
      */

      page.innerHTML =
        rewritten;


      attachNavigation();

      attachForms();

    }


    /* ==============================================
       CSS
    ============================================== */

    else if(
      type.includes("text/css")
    ){

      const css =
        await response.text();

      const style =
        document.createElement(
          "style"
        );

      style.textContent =
        rewriteCSS(
          css,
          url
        );

      page.appendChild(
        style
      );

    }


    /* ==============================================
       JSON
    ============================================== */

    else if(
      type.includes("json")
    ){

      const text =
        await response.text();

      const pre =
        document.createElement(
          "pre"
        );

      pre.textContent =
        text;

      pre.style.whiteSpace =
        "pre-wrap";

      pre.style.padding =
        "25px";

      pre.style.margin =
        "0";

      pre.style.fontFamily =
        "monospace";

      page.appendChild(
        pre
      );

    }


    /* ==============================================
       TEXT
    ============================================== */

    else if(
      type.startsWith("text/")
    ){

      const text =
        await response.text();

      const pre =
        document.createElement(
          "pre"
        );

      pre.textContent =
        text;

      pre.style.whiteSpace =
        "pre-wrap";

      pre.style.padding =
        "25px";

      page.appendChild(
        pre
      );

    }


    /* ==============================================
       IMAGE
    ============================================== */

    else if(
      type.startsWith("image/")
    ){

      const blob =
        await response.blob();

      const objectURL =
        URL.createObjectURL(
          blob
        );

      const img =
        document.createElement(
          "img"
        );

      img.src =
        objectURL;

      img.style.maxWidth =
        "100%";

      img.style.display =
        "block";

      img.style.margin =
        "20px auto";

      page.appendChild(
        img
      );

    }


    /* ==============================================
       OTHER
    ============================================== */

    else{

      /*
         For PDFs and other files, create a blob URL
         and display it where the browser supports it.
      */

      const blob =
        await response.blob();

      const objectURL =
        URL.createObjectURL(
          blob
        );

      const iframe =
        document.createElement(
          "iframe"
        );

      iframe.src =
        objectURL;

      iframe.style.width =
        "100%";

      iframe.style.height =
        "100%";

      iframe.style.border =
        "0";

      page.appendChild(
        iframe
      );

    }


    currentURL =
      url;

    address.value =
      url;

    document.title =
      getHostname(url);


    home.style.display =
      "none";


    hideLoading();

    showStatus(
      "Loaded"
    );

  }
  catch(err){

    hideLoading();

    page.innerHTML = "";

    lastErrorURL =
      url;

    error.style.display =
      "flex";

    errortext.textContent =
      "The destination could not be loaded through " +
      PROXY_NAME +
      ".\n\n" +
      "URL: " +
      url +
      "\n\n" +
      "Error: " +
      err.message +
      "\n\n" +
      "The destination may require JavaScript, WebSockets, " +
      "authentication, cookies, or may be blocked by the " +
      "proxy service.";

  }

}


/* =====================================================
   HOSTNAME
===================================================== */

function getHostname(url){

  try{

    return new URL(
      url
    ).hostname;

  }catch{

    return "Web";

  }

}


/* =====================================================
   LINK NAVIGATION
===================================================== */

function attachNavigation(){

  page
    .querySelectorAll(
      "a[href]"
    )
    .forEach(link => {

      link.addEventListener(
        "click",
        event => {

          const href =
            link.getAttribute(
              "href"
            );

          if(
            !href ||
            href.startsWith("#") ||
            href.startsWith("javascript:") ||
            href.startsWith("mailto:") ||
            href.startsWith("tel:")
          ){

            return;

          }


          event.preventDefault();


          const target =
            absoluteURL(
              href,
              currentURL
            );


          loadURL(
            target
          );

        }
      );

    });


  /*
     Handle buttons/links that use target="_blank".
  */

  page
    .querySelectorAll(
      "a[target]"
    )
    .forEach(link => {

      link.removeAttribute(
        "target"
      );

    });

}


/* =====================================================
   FORM HANDLING
===================================================== */

function attachForms(){

  page
    .querySelectorAll(
      "form[data-proxy-form]"
    )
    .forEach(form => {

      form.addEventListener(
        "submit",
        event => {

          event.preventDefault();


          const method =
            (
              form.getAttribute(
                "method"
              ) || "GET"
            ).toUpperCase();


          const action =
            form.getAttribute(
              "action"
            ) || currentURL;


          const target =
            absoluteURL(
              action,
              currentURL
            );


          /*
             Static client proxy supports GET forms
             reliably.
          */

          if(method !== "GET"){

            showStatus(
              "POST forms are not supported by this client proxy"
            );

            return;

          }


          const data =
            new FormData(
              form
            );


          const params =
            new URLSearchParams(
              data
            );


          const separator =
            target.includes("?")
              ? "&"
              : "?";


          const finalURL =
            target +
            separator +
            params.toString();


          loadURL(
            finalURL
          );

        }
      );

    });

}


/* =====================================================
   HISTORY
===================================================== */

function addHistory(url){

  if(
    historyPosition >= 0 &&
    historyList[
      historyPosition
    ] === url
  ){

    return;

  }


  historyList =
    historyList.slice(
      0,
      historyPosition + 1
    );


  historyList.push(
    url
  );


  historyPosition =
    historyList.length - 1;

}


/* =====================================================
   LOAD URL
===================================================== */

function loadURL(
  value,
  record = true
){

  const url =
    normalizeURL(
      value
    );


  if(!url)
    return;


  if(record){

    addHistory(
      url
    );

  }


  currentURL =
    url;

  address.value =
    url;


  fetchTarget(
    url
  );

}


/* =====================================================
   BACK
===================================================== */

document
  .getElementById("back")
  .onclick = () => {

    if(
      historyPosition <= 0
    ){

      showStatus(
        "No previous page"
      );

      return;

    }


    historyPosition--;


    loadURL(
      historyList[
        historyPosition
      ],
      false
    );

  };


/* =====================================================
   FORWARD
===================================================== */

document
  .getElementById("forward")
  .onclick = () => {

    if(
      historyPosition >=
      historyList.length - 1
    ){

      showStatus(
        "No next page"
      );

      return;

    }


    historyPosition++;


    loadURL(
      historyList[
        historyPosition
      ],
      false
    );

  };


/* =====================================================
   RELOAD
===================================================== */

document
  .getElementById("reload")
  .onclick = () => {

    if(currentURL){

      fetchTarget(
        currentURL
      );

    }

  };


/* =====================================================
   GO
===================================================== */

document
  .getElementById("go")
  .onclick = () => {

    loadURL(
      address.value
    );

  };


address.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      loadURL(
        address.value
      );

    }

  }
);


/* =====================================================
   HOME INPUT
===================================================== */

homeinput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      loadURL(
        homeinput.value
      );

    }

  }
);


/* =====================================================
   RETRY
===================================================== */

document
  .getElementById("retry")
  .onclick = () => {

    if(lastErrorURL){

      fetchTarget(
        lastErrorURL
      );

    }

  };


/* =====================================================
   FULLSCREEN
===================================================== */

document
  .getElementById("fullscreen")
  .onclick = async () => {

    try{

      if(
        !document.fullscreenElement
      ){

        await document
          .documentElement
          .requestFullscreen();

      }
      else{

        await document
          .exitFullscreen();

      }

    }
    catch{

      showStatus(
        "Fullscreen unavailable"
      );

    }

  };


/* =====================================================
   CLOAK
===================================================== */

document
  .getElementById("cloak")
  .onclick = () => {

    document.title =
      "Google";


    let icon =
      document.querySelector(
        "link[rel='icon']"
      );


    if(!icon){

      icon =
        document.createElement(
          "link"
        );

      icon.rel =
        "icon";

      document.head.appendChild(
        icon
      );

    }


    icon.href =
      "data:image/svg+xml," +
      encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="30"
        fill="white"/>
        <path d="M32 10a22 22 0 1 0 22 22H32z"
        fill="#4285f4"/>
        </svg>`
      );


    showStatus(
      "Cloaked"
    );

  };


/* =====================================================
   KEYBOARD SHORTCUTS
===================================================== */

document.addEventListener(
  "keydown",
  event => {


    /*
       Ctrl + L
    */

    if(
      event.ctrlKey &&
      event.key.toLowerCase() === "l"
    ){

      event.preventDefault();

      address.focus();

      address.select();

    }


    /*
       Alt + Left
    */

    if(
      event.altKey &&
      event.key === "ArrowLeft"
    ){

      event.preventDefault();

      document
        .getElementById("back")
        .click();

    }


    /*
       Alt + Right
    */

    if(
      event.altKey &&
      event.key === "ArrowRight"
    ){

      event.preventDefault();

      document
        .getElementById("forward")
        .click();

    }

  });


/* =====================================================
   INITIAL STATE
===================================================== */

homeinput.focus();

</script>

</body>
</html>
